proxy_http_version 1.1;
proxy_buffering off;
proxy_request_buffering off;
# Engine execution is synchronous and may contain several individually bounded
# commands. The proxy must not cancel its request context after Nginx's 60s
# default while the sandbox is still making progress.
proxy_read_timeout 24h;
# Artifact uploads are JSON with base64 content. Keep the gateway aligned with
# the backend's 350 MiB request-body bound so it does not reject valid bundle
# parts before the application can validate their decoded size.
client_max_body_size 350m;
client_body_timeout 30m;
proxy_send_timeout 30m;

# Live session/terminal streams are WebSockets (adr/ADR-0076): long-lived
# HTTP/1.1 streams exhausted the browser's six sockets for this host and left
# ordinary requests queued behind them.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8080;
  server_name _;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Host above drops the port; the WebSocket origin check compares the
    # page's origin against the host:port the browser actually used.
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Wharnex-Remote "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location / {
    proxy_pass http://frontend:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# Keep transport hardening shared above while remote ingress serves the
# dedicated paired webapp; provider automation remains Desktop-owned.
server {
  listen 8081;
  server_name _;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Wharnex-Remote "1";
  }

  location / {
    proxy_pass http://webapp:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }
}
